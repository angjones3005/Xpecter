<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Specter</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1e1e1e; color: #ddd; font-family: sans-serif; }
    #app { display: grid; grid-template-columns: 220px 1fr 1fr; height: 100vh; }
    #sidebar { border-right: 1px solid #333; overflow-y: auto; padding: 8px; font-size: 13px; }
    #sidebar .entry { padding: 4px 6px; cursor: pointer; border-radius: 4px; }
    #sidebar .entry:hover { background: #2a2a2a; }
    .session-entry { padding: 4px 6px; cursor: pointer; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
    .session-entry:hover { background: #2a2a2a; }
    .session-entry .delete-btn { opacity: 0.5; font-size: 11px; }
    .session-entry .delete-btn:hover { opacity: 1; color: #e5484d; }
    #terminal-pane { border-right: 1px solid #333; min-width: 0; }
    #editor-pane { min-width: 0; }
    #terminal { height: 100%; padding: 4px; box-sizing: border-box; }
    #editor { height: 100%; }
    .toolbar { padding: 6px 10px; font-size: 13px; background: #252525; border-bottom: 1px solid #333; }
    .toolbar input { background: #1a1a1a; border: 1px solid #333; color: #ddd; padding: 3px 6px; margin-right: 4px; }
    .toolbar button { padding: 3px 8px; }
  </style>
</head>
<body>
  <div id="app">
    <div id="sidebar">
      <div class="toolbar" style="padding-left:0;">
        <strong>Saved sessions</strong>
      </div>
      <div id="session-list"></div>
      <div class="toolbar" style="padding-left:0;">
        <strong>Remote files</strong>
      </div>
      <div id="file-list"></div>
    </div>
    <div id="terminal-pane">
      <div class="toolbar">
        <input id="host" placeholder="host" />
        <input id="user" placeholder="user" />
        <label style="margin-right:6px;"><input type="radio" name="authmode" value="password" checked /> Password</label>
        <label style="margin-right:6px;"><input type="radio" name="authmode" value="key" /> Key</label>
        <span id="auth-password-fields">
          <input id="password" placeholder="password" type="password" />
        </span>
        <span id="auth-key-fields" style="display:none;">
          <input id="keyPath" placeholder="key path" readonly style="width:160px;" />
          <button id="browse-key">Browse…</button>
          <input id="passphrase" placeholder="passphrase (if any)" type="password" />
        </span>
        <button id="connect">Connect</button>
        <button id="local">Local shell</button>
      </div>
      <div id="terminal"></div>
    </div>
    <div id="editor-pane">
      <div class="toolbar"><span id="editor-path">No file open</span></div>
      <div id="editor"></div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
