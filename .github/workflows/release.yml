name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact: xpecter-linux-amd64.tar.gz
          - os: windows-latest
            platform: windows
            artifact: xpecter-windows-amd64.zip
          - os: macos-latest
            platform: darwin
            artifact: xpecter-macos-universal.zip
    runs-on: ${{ matrix.os }}
    env:
      # Windows binaries are code-signed through Azure Artifact Signing
      # when the signing secrets exist (see CODEBOOK.md, "Release
      # signing"). Without them every step below that signs is skipped
      # and the release ships unsigned, exactly as it did before, so a
      # fork or a machine with no Azure account still gets a build. An
      # unsigned build is what Defender on a managed machine deletes on
      # sight, which is the whole reason the signing steps exist.
      SIGN_WINDOWS: ${{ secrets.AZURE_CLIENT_SECRET != '' && secrets.SIGNING_ACCOUNT_NAME != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Wails needs GTK3 + WebKit2GTK on Linux to build/run the webview.
      # Windows and macOS runners already ship what's needed (WebView2 is
      # preinstalled on windows-latest; macOS uses the system WebKit).
      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - name: Install Wails CLI
        # Explicitly bash: the retry loop below is shell script, and the
        # windows-latest runner defaults to PowerShell, which reads
        # "for attempt in 1 2 3" as a malformed for-statement and fails
        # the step before go install is ever reached.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go install github.com/wailsapp/wails/v2/cmd/wails@latest; then
              exit 0
            fi
            echo "go install failed (attempt $attempt/3), retrying..."
            if [ "$attempt" -lt 3 ]; then
              sleep 5
            fi
          done
          echo "go install failed after 3 attempts"
          exit 1

      # NSIS ships pre-installed on windows-latest runners, but versions
      # drift over time and we've seen reports of that breaking `wails
      # build -nsis` for other projects. Installing explicitly via choco
      # (always present on GitHub-hosted Windows runners) makes this
      # deterministic instead of depending on whatever happens to be on
      # the image today.
      - name: Install NSIS (Windows)
        if: matrix.platform == 'windows'
        run: |
          choco install nsis -y
          # Chocolatey installs the package fine, but its own PATH
          # update doesn't carry over to subsequent workflow steps,
          # each step runs in a fresh shell and only inherits PATH
          # changes explicitly written here, confirmed the hard way:
          # wails build -nsis reported "makensis not found" even though
          # NSIS was genuinely installed on disk at this point.
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH
        shell: pwsh

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # The tag is the version. Wails stamps info.productVersion into
      # the Windows version resource and the installer's own metadata,
      # and it can only read it from wails.json, so the file is edited
      # in the checkout before building. A binary with a real product
      # name, company and version in its properties is one more thing
      # that separates it from malware in the eyes of a scanner.
      - name: Stamp the version into wails.json
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const j = JSON.parse(fs.readFileSync('wails.json', 'utf8'));
            j.info = Object.assign({}, j.info, { productVersion: '${{ github.ref_name }}'.replace(/^v/, '') });
            fs.writeFileSync('wails.json', JSON.stringify(j, null, 2) + '\n');
          "
          grep productVersion wails.json

      - name: Build (Linux)
        if: matrix.platform == 'linux'
        run: |
          wails build -platform linux/amd64 -tags webkit2_41 -ldflags "-X main.Version=${{ github.ref_name }}"
          tar -czf ${{ matrix.artifact }} -C build/bin .

      - name: Build (Windows)
        if: matrix.platform == 'windows'
        run: wails build -platform windows/amd64 -ldflags "-X main.Version=${{ github.ref_name }}"
        shell: pwsh

      # Signed in place, before it is zipped and before the installer
      # wraps it. The certificate comes from an Azure Artifact Signing
      # account; the runner never holds a key, it asks the service to
      # sign a hash. Timestamped so the signature outlives the
      # certificate's own validity.
      - name: Sign xpecter.exe (Azure Artifact Signing)
        if: matrix.platform == 'windows' && env.SIGN_WINDOWS == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.SIGNING_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\build\bin
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Package Windows zip
        if: matrix.platform == 'windows'
        run: |
          if ($env:SIGN_WINDOWS -eq 'true') { Write-Host "Packaging a signed xpecter.exe" } else { Write-Host "Packaging an UNSIGNED xpecter.exe (signing secrets not configured)" }
          # Kept aside: the installer build below compiles a second exe
          # over this one, and the signed copy is what goes back into
          # the installer afterwards.
          New-Item -ItemType Directory -Force signed | Out-Null
          Copy-Item build/bin/xpecter.exe signed/xpecter.exe
          Compress-Archive -Path build/bin/* -DestinationPath ${{ matrix.artifact }}
        shell: pwsh

      # Separate, redundant build rather than folding -nsis into the step
      # above: if NSIS ever breaks (it has, across Wails versions, per
      # upstream issues), continue-on-error here means the release still
      # ships with the portable .exe/.zip above either way, this is
      # purely additive, never a release blocker.
      - name: Build Windows installer (NSIS)
        if: matrix.platform == 'windows'
        continue-on-error: true
        run: wails build -platform windows/amd64 -nsis -ldflags "-X main.Version=${{ github.ref_name }}"
        shell: pwsh

      # `wails build -nsis` compiled a fresh, unsigned exe and wrapped
      # that. The signed copy goes back over it and makensis is run
      # again on the project Wails just generated, with the same
      # argument Wails itself passes, so the installer carries the
      # signed binary. The WebView2 bootstrapper and the generated .nsh
      # are still in place from the Wails run.
      - name: Rebuild the installer around the signed exe
        if: matrix.platform == 'windows' && env.SIGN_WINDOWS == 'true'
        continue-on-error: true
        run: |
          Copy-Item signed/xpecter.exe build/bin/xpecter.exe -Force
          Push-Location build/windows/installer
          makensis -DARG_WAILS_AMD64_BINARY=..\..\bin\xpecter.exe project.nsi
          Pop-Location
        shell: pwsh

      # The exact filename Wails gives the NSIS installer isn't
      # something to hardcode and hope, confirmed the hard way (a first
      # attempt assumed xpecter-amd64-installer.exe, the real build
      # produced something else, and the mismatch silently meant no
      # installer ever got uploaded, continue-on-error above hid the
      # underlying failure too). Find whatever file actually exists and
      # rename it to a name we control, so the release asset filename
      # (and the download site's link to it) stays predictable
      # regardless of what Wails' own convention turns out to be.
      - name: Locate and rename Windows installer
        if: matrix.platform == 'windows'
        continue-on-error: true
        run: |
          $installer = Get-ChildItem -Path build/bin -Filter "*installer*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($installer) {
            Copy-Item $installer.FullName build/bin/xpecter-windows-installer.exe
            Write-Host "Found installer: $($installer.Name) -> xpecter-windows-installer.exe"
          } else {
            Write-Host "No installer file found in build/bin, NSIS build likely failed above."
          }
        shell: pwsh

      # The installer is its own executable and gets its own signature;
      # a signed exe inside an unsigned installer still trips
      # SmartScreen at the download. Signed after the rename so the
      # file name is known, and only that file: xpecter.exe was signed
      # once already.
      - name: Sign the installer (Azure Artifact Signing)
        if: matrix.platform == 'windows' && env.SIGN_WINDOWS == 'true'
        continue-on-error: true
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.SIGNING_PROFILE_NAME }}
          files: ${{ github.workspace }}\build\bin\xpecter-windows-installer.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Upload Windows installer (NSIS)
        if: matrix.platform == 'windows'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: xpecter-windows-installer.exe
          path: build/bin/xpecter-windows-installer.exe
          retention-days: 7

      - name: Build (macOS)
        if: matrix.platform == 'darwin'
        run: |
          wails build -platform darwin/universal -ldflags "-X main.Version=${{ github.ref_name }}"
          cd build/bin
          zip -r ../../${{ matrix.artifact }} .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # One line per asset. This is what an IT department asks for when
      # it allow-lists a program by hash rather than by publisher, and
      # what anyone can check a download against.
      - name: Write SHA-256 checksums
        run: |
          cd artifacts
          sha256sum * | tee SHA256SUMS.txt

      - name: Publish release (Xpecter repo, private)
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

      # Public-facing distribution: the Xpecter repo itself stays
      # private, but builds still need somewhere the public can
      # download from. DAWNRAIL_TOKEN is a fine-grained PAT scoped to
      # just the Dawnrail repo with Contents: Read and write, the
      # default GITHUB_TOKEN only has permission inside the repo the
      # workflow runs in, it can't create a release anywhere else.
      - name: Publish release (Dawnrail repo, public)
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          repository: Dawnrail/Dawnrail
          token: ${{ secrets.DAWNRAIL_TOKEN }}
